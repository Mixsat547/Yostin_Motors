name: yostinmotors-release

# Configuración común a las cuatro instancias
x-api-env: &api-env
  ASPNETCORE_ENVIRONMENT: Development   # permite usar Scalar en cada puerto durante la demostración
  ConnectionStrings__Connection: Host=db;Port=5432;Database=${POSTGRES_DB};Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD}
  DataProtection__KeysPath: /keys       # carpeta compartida de claves: todas leen la misma cookie
  Cors__AllowedOrigins: ${FRONTEND_URL}
  Auth__Admins: ${AUTH_ADMINS}
  Discord__ClientId: ${DISCORD_CLIENT_ID}
  Discord__ClientSecret: ${DISCORD_CLIENT_SECRET}
  Google__ClientId: ${GOOGLE_CLIENT_ID}
  Google__ClientSecret: ${GOOGLE_CLIENT_SECRET}

x-api: &api
  image: ${API_IMAGE:?Define API_IMAGE en .env (usuario/yostinmotors:1.0.0)}
  restart: unless-stopped
  volumes:
    - keys:/keys
  networks:
    - yostin-net

services:
  db:
    image: postgres:16
    container_name: yostin-rel-db
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - yostin-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  api1:
    <<: *api
    container_name: yostin-api1
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "5001:8080"
    environment:
      <<: *api-env
      Database__MigrateOnStartup: "true"     # solo esta instancia crea las tablas
      Discord__RedirectUri: http://localhost:5001/api/auth/discord/callback
      Google__RedirectUri: http://localhost:5001/api/auth/google/callback
      Frontend__Url: http://localhost:5001/api/auth/me

  api2:
    <<: *api
    container_name: yostin-api2
    depends_on:
      db:
        condition: service_healthy
      api1:
        condition: service_started
    ports:
      - "5002:8080"
    environment:
      <<: *api-env
      Database__MigrateOnStartup: "false"
      Discord__RedirectUri: http://localhost:5002/api/auth/discord/callback
      Google__RedirectUri: http://localhost:5002/api/auth/google/callback
      Frontend__Url: http://localhost:5002/api/auth/me

  api3:
    <<: *api
    container_name: yostin-api3
    depends_on:
      db:
        condition: service_healthy
      api1:
        condition: service_started
    ports:
      - "5003:8080"
    environment:
      <<: *api-env
      Database__MigrateOnStartup: "false"
      Discord__RedirectUri: http://localhost:5003/api/auth/discord/callback
      Google__RedirectUri: http://localhost:5003/api/auth/google/callback
      Frontend__Url: http://localhost:5003/api/auth/me

  api4:
    <<: *api
    container_name: yostin-api4
    depends_on:
      db:
        condition: service_healthy
      api1:
        condition: service_started
    ports:
      - "5004:8080"
    environment:
      <<: *api-env
      Database__MigrateOnStartup: "false"
      Discord__RedirectUri: http://localhost:5004/api/auth/discord/callback
      Google__RedirectUri: http://localhost:5004/api/auth/google/callback
      Frontend__Url: http://localhost:5004/api/auth/me

networks:
  yostin-net:

volumes:
  pgdata:
  keys: